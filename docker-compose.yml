version: '3.8'

services:
  epaper-display:
    build:
      context: .
      network: host
    platform: linux/arm64
    container_name: epaper_dashboard
    privileged: true
    environment:
      # Display timezone (needs tzdata in the image, installed via Dockerfile)
      - TZ=${TZ:-America/New_York}
      # How often the display refreshes, in seconds (default 300 = 5 min)
      - REFRESH_INTERVAL=300
      # Leave blank to auto-detect from IP, or set e.g. "Rochester"
      - WEATHER_LOCATION=
      # "u" = imperial (F), "m" = metric (C)
      - WEATHER_UNITS=u
      # Secret work-calendar ICS URL. Set in a local .env file (git-ignored)
      # or in the Portainer stack env — never commit the actual URL.
      - WORK_ICS_URL=${WORK_ICS_URL:-}
      # Google (Calendar + Tasks) secrets — set these in the Portainer stack
      # environment (never in git; this repo is public). Mint them once with
      # app/google_auth.py. Empty = Google sources simply stay off.
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - GOOGLE_REFRESH_TOKEN=${GOOGLE_REFRESH_TOKEN:-}
      - GOOGLE_CALENDAR_ID=${GOOGLE_CALENDAR_ID:-primary}
      # Show only in-progress/upcoming events (all-day always shown). 0 = full day.
      - HIDE_PAST_EVENTS=1
      # Shuffle task order each refresh. 0 = keep Google's order.
      - SHUFFLE_TASKS=1
      # Workaround for the fading panel: white-on-black holds far better.
      # Set to 0 to go back to the light design.
      - DARK_MODE=1
      # Ghost-busting deep-clean cadence (cycles); 0 disables.
      - DEEP_CLEAN_EVERY=12
      # One-shot hardware test mode — keep 0 for normal operation.
      - DIAGNOSTIC=0
    devices:
      - "/dev/gpiomem:/dev/gpiomem"
      - "/dev/spidev0.0:/dev/spidev0.0"
    restart: always